[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-core"
version = "0.1.0"
description = "AI QA Engineer & CI Reliability Agent"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "langgraph>=0.0.26",
    "langchain>=0.1.0",
    "playwright>=1.41.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "pytest>=8.0.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.1.0",
    "PyGithub>=2.1.1",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "pytest-cov"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long rich/console strings; line length left to the formatter

[tool.ruff.lint.per-file-ignores]
"poc_api/main.py" = ["E402"]  # imports after sys.path insert of repo root

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
