[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-core"
version = "0.1.0"
description = "AI QA Engineer & CI Reliability Agent"
authors = [
    { name = "Taimoor" },
    { name = "Shazil" },
    { name = "Abdul" },
]
dependencies = [
    "playwright>=1.41.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "docs", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long rich/console strings; line length left to the formatter

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
