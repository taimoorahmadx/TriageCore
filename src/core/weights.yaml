# TriageCore ConfidenceEngine weights
# ===================================
# Existing QA values were elicited by a human. New CI probability values may be agent-proposed
# only under an explicit task and must include provenance and provisional status (AGENTS.md rule 1).
# `null` = not yet filled in. The engine refuses to start until every value is filled.
# Check progress with:   .venv/bin/python -m src.core.weights
#
# Rules the loader enforces:
#   - probabilities lie strictly between 0 and 1 (never exactly 0 or 1: no evidence is ever certain)
#   - priors sum to 1; each likelihood row (one cause, across that group's states) sums to 1
#   - a row may be the word `uninformative` if that evidence says nothing about that cause
#   - costs are non-negative numbers on any consistent scale (e.g. engineer-minutes)
# Record the reason behind each number in docs/contracts/weights_elicitation.md.
#
# QA values authored by Abdul Mohaimin on 2026-10-11 (elicitation session); QA cost unit:
# 1 = one needless escalation. CI values and their provenance are documented separately.

qa:
  # Possible causes of a broken test step (must be values of the contract's classification enum).
  hypotheses: [stale_selector, likely_regression, flaky]

  # P(cause) BEFORE looking at any evidence: out of 100 broken steps, how many are each cause?
  priors:
    stale_selector: 0.70      # harmless UI change: element renamed/moved, app still works
    likely_regression: 0.15   # real bug: the app itself is broken
    flaky: 0.15               # timing: element was just slow to appear

  # Evidence groups. For each cause: "if this cause were true, how often would we see each state?"
  groups:
    runtime_failure:
      # How many of {uncaught page error, error banner shown, failed network request} fired after the click.
      states: ["0", "1", "2+"]
      likelihoods:
        stale_selector:    {"0": 0.90, "1": 0.08, "2+": 0.02}
        likely_regression: {"0": 0.30, "1": 0.35, "2+": 0.35}
        flaky:             {"0": 0.90, "1": 0.08, "2+": 0.02}

    state_progression:
      # Did the step's expected result (e.g. "cart shows 1 item") appear after the click?
      states: [reached, not_reached]
      likelihoods:
        stale_selector:    {reached: 0.90, not_reached: 0.10}
        likely_regression: {reached: 0.10, not_reached: 0.90}
        flaky:             {reached: 0.85, not_reached: 0.15}

    console_noise:
      # Any console.error messages after the click? Third-party scripts often log harmless errors,
      # so this should usually differ only weakly between causes.
      states: [present, absent]
      likelihoods:
        stale_selector:    {present: 0.15, absent: 0.85}
        likely_regression: {present: 0.60, absent: 0.40}
        flaky:             {present: 0.20, absent: 0.80}

    action_outcome:
      # Did the click itself execute without a Playwright error?
      states: [succeeded, failed]
      likelihoods:
        stale_selector:    {succeeded: 0.95, failed: 0.05}
        likely_regression: {succeeded: 0.75, failed: 0.25}
        flaky:             {succeeded: 0.90, failed: 0.10}

    timing:
      # Before relocating, the ORIGINAL selector is re-tried with backoff. Did it appear after all?
      states: [resolved_after_wait, not_resolved]
      likelihoods:
        stale_selector:    {resolved_after_wait: 0.02, not_resolved: 0.98}
        likely_regression: {resolved_after_wait: 0.05, not_resolved: 0.95}
        flaky:             {resolved_after_wait: 0.90, not_resolved: 0.10}

  # Autonomous actions and the causes under which each is the RIGHT thing to do.
  # (`escalate` = hand to a human; always available, so it is not listed here.)
  actions:
    heal: [stale_selector]    # apply the relocated selector and continue
    flag: [flaky]             # keep the original selector, report the step as flaky

ci:
  # C9 proposal; values are provisional and not calibrated. See ci_weights_elicitation.md.
  # Shazil approved the single `default` tier loss policy on 2026-10-27.
  enabled: true
  hypotheses: [flaky, dependency, bug, infra]
  # No representative reviewed CI dataset exists yet; equal priors avoid asserting prevalence.
  priors: {flaky: 0.25, dependency: 0.25, bug: 0.25, infra: 0.25}
  groups:
    failure_kind:
      states: [test_assertion, compile_or_syntax, import_or_missing_module, dependency_resolution, network_or_timeout, runner_or_resources, other]
      likelihoods:
        flaky:      {test_assertion: 0.05, compile_or_syntax: 0.02, import_or_missing_module: 0.02, dependency_resolution: 0.03, network_or_timeout: 0.45, runner_or_resources: 0.35, other: 0.08}
        dependency: {test_assertion: 0.02, compile_or_syntax: 0.03, import_or_missing_module: 0.35, dependency_resolution: 0.45, network_or_timeout: 0.02, runner_or_resources: 0.03, other: 0.10}
        bug:        {test_assertion: 0.55, compile_or_syntax: 0.20, import_or_missing_module: 0.02, dependency_resolution: 0.02, network_or_timeout: 0.02, runner_or_resources: 0.02, other: 0.17}
        infra:      {test_assertion: 0.03, compile_or_syntax: 0.02, import_or_missing_module: 0.02, dependency_resolution: 0.03, network_or_timeout: 0.20, runner_or_resources: 0.50, other: 0.20}
    dependency_change:
      states: [changed, unchanged]
      likelihoods:
        flaky:      {changed: 0.10, unchanged: 0.90}
        dependency: {changed: 0.80, unchanged: 0.20}
        bug:        {changed: 0.35, unchanged: 0.65}
        infra:      {changed: 0.20, unchanged: 0.80}
    code_link:
      states: [failing_file_touched, not_touched]
      likelihoods:
        flaky:      {failing_file_touched: 0.15, not_touched: 0.85}
        dependency: {failing_file_touched: 0.45, not_touched: 0.55}
        bug:        {failing_file_touched: 0.80, not_touched: 0.20}
        infra:      {failing_file_touched: 0.10, not_touched: 0.90}
    log_coverage:
      states: [truncated, complete]
      likelihoods:
        # Equal likelihoods make coverage non-discriminating; truncation does not imply a cause.
        flaky:      {truncated: 0.10, complete: 0.90}
        dependency: {truncated: 0.10, complete: 0.90}
        bug:        {truncated: 0.10, complete: 0.90}
        infra:      {truncated: 0.10, complete: 0.90}
  actions:
    rerun: [flaky]
    auto-fix: [dependency, bug]

thresholds:
  qa:
    # If evidence is improbable under every cause, autonomous actions are blocked and the engine
    # escalates as an unrecognised pattern; classification still reports the most likely cause.
    # (0-1, e.g. small)
    unknown_pattern_floor: 0.10

    # Cost of each action under each true cause, per risk tier of the step.
    # Typical shape: a correct action costs 0; healing a real regression (masking a bug) is the
    # most expensive mistake; escalating a harmless change costs some engineer time.
    loss:
      low:     # reversible step, e.g. add to cart
        heal:     {stale_selector: 0, likely_regression: 5, flaky: 3}
        flag:     {stale_selector: 1, likely_regression: 5, flaky: 0}
        escalate: {stale_selector: 1, likely_regression: 0, flaky: 1}
      medium:  # e.g. apply coupon, form submission
        heal:     {stale_selector: 0, likely_regression: 20, flaky: 3}
        flag:     {stale_selector: 1, likely_regression: 20, flaky: 0}
        escalate: {stale_selector: 1, likely_regression: 0, flaky: 1}
      high:    # irreversible step, e.g. payment
        heal:     {stale_selector: 0, likely_regression: 100, flaky: 3}
        flag:     {stale_selector: 1, likely_regression: 100, flaky: 0}
        escalate: {stale_selector: 1, likely_regression: 0, flaky: 1}
  ci:
    # A single initial tier, with policy loss points approved by Shazil on 2026-10-27.
    unknown_pattern_floor: 0.05
    loss:
      default:
        rerun:    {flaky: 0, dependency: 10, bug: 10, infra: 10}
        auto-fix: {flaky: 10, dependency: 0, bug: 0, infra: 10}
        escalate: {flaky: 2, dependency: 2, bug: 2, infra: 0}
