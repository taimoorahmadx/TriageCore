<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageCore Checkout</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
        }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container { 
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 40px; 
            width: 100%;
            max-width: 420px; 
        }
        
        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .order-summary {
            background-color: #F9FAFB;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        
        .submit-btn { 
            background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
            color: white; 
            border: none; 
            border-radius: 8px;
            padding: 14px 20px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }
        
        .submit-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.4);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }
        
        .success-msg { 
            background-color: #ECFDF5;
            color: #065F46;
            border: 1px solid #A7F3D0;
            border-radius: 8px;
            padding: 16px;
            font-weight: 600; 
            margin-top: 20px; 
            display: none; 
            text-align: center;
        }

        /* SVG icon styling for success */
        .success-icon {
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Complete your order</h2>
        <p class="subtitle">Enter your details to finalize the purchase.</p>
        
        <div class="order-summary">
            <span>Total:</span>
            <span style="color: var(--primary); font-size: 18px;">$99.00</span>
        </div>

        <form id="checkout-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
            </div>
            
            <!-- In the POC, the human will manually change this ID to 'submit-btn-changed' before running the script -->
            <button type="button" id="submit-btn" class="submit-btn">Complete Purchase</button>
        </form>
        
        <div id="success-msg" class="success-msg">
            <svg class="success-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            Payment Successful!
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.querySelector(".submit-btn"); // Bind via class to simulate underlying logic surviving an ID change
            
            const urlParams = new URLSearchParams(window.location.search);
            const scenario = urlParams.get('scenario');

            btn.addEventListener("click", () => {
                // Simulate network delay
                const originalText = btn.innerText;
                btn.innerText = "Processing...";
                btn.style.opacity = "0.8";

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.opacity = "1";

                    if (scenario === 'trap') {
                        // Scenario 2: The trap. The button exists, but the logic is broken.
                        console.error("Uncaught ReferenceError: processPayment is not defined at HTMLButtonElement.onclick");
                        // Intentionally do NOT show the success message.
                    } else {
                        // Scenario 1: The control. Everything works perfectly.
                        document.getElementById("success-msg").style.display = "block";
                        document.getElementById("checkout-form").style.display = "none";
                    }
                }, 800); // 800ms fake network delay
            });
        });
    </script>
</body>
</html>
