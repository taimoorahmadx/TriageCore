scenarios:
  - id: b1_rename_delete
    title: Renamed delete control works
    description: A harmless class rename; deleting the seeded completed item succeeds.
    page: apps/modern-todomvc/index.html?mode=rename&target=delete&item=b1_rename_delete
    steps:
      - id: delete_item
        name: Delete the seeded completed todo
        intent: Delete the todo named "B1 delete item (rename)" from the TodoMVC list.
        original_selector: button.destroy
        container_selector: '[data-id="b1_rename_delete"]'
        expected_state_selector: '[data-b1-state="success"]'
        error_state_selector: null
        risk_tier: low

  - id: b1_rename_toggle
    title: Renamed completion control works
    description: A harmless class rename; completing the seeded active item succeeds.
    page: apps/modern-todomvc/index.html?mode=rename&target=toggle&item=b1_rename_toggle
    steps:
      - id: complete_item
        name: Complete the seeded active todo
        intent: Mark the todo named "B1 toggle item (rename)" as complete.
        original_selector: input.toggle
        container_selector: '[data-id="b1_rename_toggle"]'
        expected_state_selector: '[data-b1-state="success"]'
        error_state_selector: null
        risk_tier: low

