# SYNTHETIC TEST VALUES - NOT THE PROJECT'S WEIGHTS.
# Chosen only so the engine's arithmetic can be checked by hand in tests/test_engine.py.
# The real QA values live in src/core/weights.yaml; future CI values may be provisional proposals.

qa:
  hypotheses: [stale_selector, likely_regression, flaky]
  priors: {stale_selector: 0.6, likely_regression: 0.3, flaky: 0.1}
  groups:
    runtime_failure:
      states: ["0", "1", "2+"]
      likelihoods:
        stale_selector:    {"0": 0.90, "1": 0.08, "2+": 0.02}
        likely_regression: {"0": 0.20, "1": 0.30, "2+": 0.50}
        flaky:             {"0": 0.85, "1": 0.10, "2+": 0.05}
    state_progression:
      states: [reached, not_reached]
      likelihoods:
        stale_selector:    {reached: 0.9, not_reached: 0.1}
        likely_regression: {reached: 0.2, not_reached: 0.8}
        flaky:             {reached: 0.5, not_reached: 0.5}
    console_noise:
      states: [present, absent]
      likelihoods:
        stale_selector:    {present: 0.2, absent: 0.8}
        likely_regression: {present: 0.6, absent: 0.4}
        flaky:             uninformative
    action_outcome:
      states: [succeeded, failed]
      likelihoods:
        stale_selector:    {succeeded: 0.95, failed: 0.05}
        likely_regression: {succeeded: 0.70, failed: 0.30}
        flaky:             {succeeded: 0.90, failed: 0.10}
    timing:
      states: [resolved_after_wait, not_resolved]
      likelihoods:
        stale_selector:    {resolved_after_wait: 0.02, not_resolved: 0.98}
        likely_regression: {resolved_after_wait: 0.02, not_resolved: 0.98}
        flaky:             {resolved_after_wait: 0.90, not_resolved: 0.10}
  actions:
    heal: [stale_selector]
    flag: [flaky]

ci:
  hypotheses: [flaky, dependency, bug, infra]
  priors: {flaky: 0.25, dependency: 0.25, bug: 0.25, infra: 0.25}
  groups:
    failure_kind:
      states: [test_assertion, compile_or_syntax, import_or_missing_module, dependency_resolution, network_or_timeout, runner_or_resources, other]
      likelihoods:
        flaky:      {test_assertion: 0.03, compile_or_syntax: 0.03, import_or_missing_module: 0.02, dependency_resolution: 0.04, network_or_timeout: 0.80, runner_or_resources: 0.06, other: 0.02}
        dependency: {test_assertion: 0.03, compile_or_syntax: 0.05, import_or_missing_module: 0.75, dependency_resolution: 0.12, network_or_timeout: 0.01, runner_or_resources: 0.02, other: 0.02}
        bug:        {test_assertion: 0.75, compile_or_syntax: 0.10, import_or_missing_module: 0.02, dependency_resolution: 0.03, network_or_timeout: 0.02, runner_or_resources: 0.03, other: 0.05}
        infra:      {test_assertion: 0.05, compile_or_syntax: 0.05, import_or_missing_module: 0.03, dependency_resolution: 0.04, network_or_timeout: 0.10, runner_or_resources: 0.63, other: 0.10}
    dependency_change:
      states: [changed, unchanged]
      likelihoods:
        flaky:      {changed: 0.10, unchanged: 0.90}
        dependency: {changed: 0.80, unchanged: 0.20}
        bug:        {changed: 0.30, unchanged: 0.70}
        infra:      {changed: 0.20, unchanged: 0.80}
    code_link:
      states: [failing_file_touched, not_touched]
      likelihoods:
        flaky:      {failing_file_touched: 0.10, not_touched: 0.90}
        dependency: {failing_file_touched: 0.80, not_touched: 0.20}
        bug:        {failing_file_touched: 0.90, not_touched: 0.10}
        infra:      {failing_file_touched: 0.10, not_touched: 0.90}
    log_coverage:
      states: [truncated, complete]
      likelihoods:
        flaky:      {truncated: 0.10, complete: 0.90}
        dependency: {truncated: 0.10, complete: 0.90}
        bug:        {truncated: 0.10, complete: 0.90}
        infra:      {truncated: 0.60, complete: 0.40}
  actions:
    rerun: [flaky]
    auto-fix: [dependency, bug]

thresholds:
  qa:
    unknown_pattern_floor: 0.05
    loss:
      low:
        heal:     {stale_selector: 0, likely_regression: 10, flaky: 3}
        flag:     {stale_selector: 2, likely_regression: 10, flaky: 0}
        escalate: {stale_selector: 1, likely_regression: 0, flaky: 1}
      high:
        heal:     {stale_selector: 0, likely_regression: 100, flaky: 3}
        flag:     {stale_selector: 2, likely_regression: 100, flaky: 0}
        escalate: {stale_selector: 1, likely_regression: 0, flaky: 1}
  ci:
    unknown_pattern_floor: 0.05
    loss:
      default:
        rerun:    {flaky: 0, dependency: 10, bug: 10, infra: 10}
        auto-fix: {flaky: 10, dependency: 0, bug: 0, infra: 10}
        escalate: {flaky: 2, dependency: 2, bug: 2, infra: 0}
